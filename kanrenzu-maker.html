<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>付箋関連図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;600&display=swap');
  :root{--paper:#EBEDE9;--paper-2:#F4F5F2;--card:#FBFBF8;--ink:#2E3140;--ink-soft:#5A5E6B;--line:#CFD3CC;--problem:#F4D9A2;--pain:#EBC9D6;--fact:#CFE0EE;--hope:#C8E4D1;--edge:#6F737C;--accent:#2F8E81;}
  *{box-sizing:border-box;}html,body{margin:0;padding:0;}body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);background:radial-gradient(120% 90% at 50% -10%,var(--paper-2) 0%,var(--paper) 60%) fixed;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 18px 46px;}header{margin-bottom:16px;}.title{font-family:'Shippori Mincho',serif;font-weight:600;font-size:25px;letter-spacing:.04em;margin:0;}.subtitle{margin:6px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(46,49,64,.04),0 8px 28px rgba(46,49,64,.05);}
  textarea#input{width:100%;min-height:84px;resize:vertical;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;line-height:1.8;color:var(--ink);}textarea#input::placeholder{color:#A7ABA4;}
  .controls{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;font-size:13.5px;font-weight:500;transition:transform .08s,box-shadow .15s,background .15s,opacity .15s;}button:active{transform:translateY(1px);}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}button:disabled{opacity:.38;cursor:default;}
  .btn-go{background:var(--ink);color:#FBFAF6;padding:10px 20px;margin-left:auto;}.btn-go:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:10px 12px;}.btn-ghost:hover{color:var(--ink);}
  .note-txt{font-size:11.5px;color:#9A9E97;margin-top:8px;line-height:1.6;}
  .toolbar{display:flex;gap:8px;align-items:center;margin:16px 0 8px;flex-wrap:wrap;}
  .tool{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 13px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;}.tool.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(47,142,129,.3);}
  .tool-hint{font-size:12px;color:var(--ink-soft);}select#addType{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:8px 8px;}
  .stage{position:relative;width:100%;height:clamp(480px,66vh,700px);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;background-image:radial-gradient(rgba(46,49,64,.07) 1px,transparent 1px);background-size:22px 22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 8px 28px rgba(46,49,64,.05);}
  .stage.linkmode{box-shadow:inset 0 0 0 2px var(--accent),0 8px 28px rgba(46,49,64,.05);}
  svg.edges{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}svg.edges .eline,svg.edges .ehit,svg.edges .elabel{pointer-events:auto;}
  .frame{position:absolute;border:1.6px dashed rgba(46,49,64,.4);border-radius:14px;background:rgba(46,49,64,.04);z-index:1;touch-action:none;cursor:move;}
  .frame.problem{border-color:#D2A24F;background:rgba(244,217,162,.20);}.frame.pain{border-color:#CC8FA9;background:rgba(235,201,214,.22);}.frame.fact{border-color:#7FA6C6;background:rgba(207,224,238,.28);}.frame.hope{border-color:#7FBE93;background:rgba(200,228,209,.26);}
  .frame-label{position:absolute;top:-13px;left:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:text;outline:none;white-space:nowrap;}
  .frame-del{position:absolute;top:-12px;right:8px;width:21px;height:21px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:19px;text-align:center;color:var(--ink-soft);cursor:pointer;}.frame-del:hover{color:#A03A30;}
  .frame-handle{position:absolute;right:-8px;bottom:-8px;width:17px;height:17px;border-radius:5px;background:var(--card);border:1.6px solid var(--accent);cursor:nwse-resize;}
  .snote{position:absolute;transform:translate(-50%,-50%);max-width:150px;min-width:62px;z-index:5;padding:10px 12px 11px;font-size:13px;font-weight:500;line-height:1.5;color:#3A3320;cursor:grab;user-select:none;touch-action:none;text-align:center;word-break:auto-phrase;border-radius:3px 3px 12px 3px;box-shadow:0 2px 5px rgba(46,49,64,.18),0 8px 14px rgba(46,49,64,.08);}
  .snote::after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:12px 0 12px 0;background:rgba(46,49,64,.10);}.snote:active{cursor:grabbing;}
  .snote.problem{background:var(--problem);}.snote.pain{background:var(--pain);}.snote.fact{background:var(--fact);}.snote.hope{background:var(--hope);}
  .snote.pick{outline:3px solid var(--accent);outline-offset:2px;}.snote.fsel{outline:3px dashed #5C7FA0;outline-offset:2px;}
  .stage.linkmode .snote,.stage.framesel .snote{cursor:pointer;}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#AEB2AB;text-align:center;padding:24px;pointer-events:none;z-index:0;}
  .placeholder .big{font-family:'Shippori Mincho',serif;font-size:17px;color:#9CA09A;line-height:1.8;}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:rgba(251,251,248,.7);backdrop-filter:blur(2px);color:var(--ink-soft);font-family:'Shippori Mincho',serif;font-size:15px;z-index:60;}
  .loading .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg);}}
  text.elabel{font-size:11.5px;font-family:'Zen Kaku Gothic New',sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4;stroke-linejoin:round;cursor:pointer;font-weight:700;}text.elabel.empty{fill:#9CA09A;font-weight:500;}
  .pop{position:absolute;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px rgba(46,49,64,.18);padding:12px;width:min(290px,88%);display:none;}
  .pop.show{display:block;}.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
  .pop .preset{font-size:12.5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink);}.pop .preset:hover{background:#E2E5E0;}
  .pop input[type=text],.pop textarea{width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;background:#fff;color:var(--ink);}.pop textarea{min-height:58px;resize:vertical;line-height:1.6;}
  .pop .acts{display:flex;gap:7px;margin-top:9px;}.pop .save{background:var(--ink);color:#fff;padding:8px 16px;}.pop .del{background:transparent;color:#A03A30;padding:8px 10px;}.pop .cancel{background:transparent;color:var(--ink-soft);padding:8px 10px;margin-left:auto;}.pop .ptitle{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin:0 0 7px;}
  .sw-btn{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(46,49,64,.12);}.sw-btn.sel{border-color:var(--ink);}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:13px;}.legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);}.legend .sw{width:13px;height:13px;border-radius:3px 3px 6px 3px;box-shadow:0 1px 2px rgba(46,49,64,.2);}
  .footer-note{font-size:11px;color:#A7ABA4;margin-top:20px;line-height:1.85;}
  .init-note{font-size:12px;color:#5C7FA0;margin-top:10px;}
  @media (max-width:560px){.title{font-size:21px;}.btn-go{margin-left:0;width:100%;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">付箋関連図</h1>
    <p class="subtitle">話す・書くと、言葉が付箋になります。並べて、囲んで、線でつなぐのはあなた。</p>
  </header>
  <div class="panel">
    <textarea id="input" placeholder="思っていることを、そのまま書くか話してみてください。短い言葉の付箋にほどきます。"></textarea>
    <div class="controls">
      <button class="btn-ghost" id="clearInput">消す</button>
      <button class="btn-go" id="go">付箋にする</button>
    </div>
    <p class="note-txt" id="micNote"></p>
    <p class="init-note" id="initNote">準備完了。テキストを入力して「付箋にする」を押してください。</p>
  </div>
  <div class="toolbar">
    <button class="tool" id="undoBtn" disabled title="Ctrl+Z でも戻せます">↩ 戻る</button>
    <select id="addType">
      <option value="problem">問題・悩み</option>
      <option value="pain">しんどい気持ち</option>
      <option value="fact">状況・事実</option>
      <option value="hope">どうなりたい</option>
    </select>
    <button class="tool" id="addNote">＋ 付箋</button>
    <button class="tool" id="addFrame">▢ 枠で囲む</button>
    <button class="tool" id="linkMode">⟶ 線をつなぐ</button>
    <button class="btn-ghost" id="clearBoard">全部消す</button>
    <span class="tool-hint" id="hint">付箋はドラッグで移動／ダブルタップで編集・色変え</span>
  </div>
  <div class="stage" id="stage">
    <svg class="edges" id="edges"><defs><marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker></defs></svg>
    <div class="placeholder" id="placeholder">
      <div class="big">ここに付箋が並びます。<br>つなぎ方も、答えも、あなたのもの。</div>
    </div>
    <div class="pop" id="edgePop">
      <p class="ptitle">この線の関係は？</p>
      <div class="row" id="presets"></div>
      <input type="text" id="edgeInput" placeholder="自由に書く（例：〜が原因で）">
      <div class="acts">
        <button class="save" id="edgeSave">決定</button>
        <button class="del" id="edgeDel">線を削除</button>
        <button class="cancel" id="edgeCancel">閉じる</button>
      </div>
    </div>
    <div class="pop" id="notePop">
      <p class="ptitle">付箋を編集</p>
      <textarea id="noteInput"></textarea>
      <div class="row" id="noteSwatches" style="margin-top:9px;"></div>
      <div class="acts">
        <button class="save" id="noteSave">決定</button>
        <button class="del" id="noteDel">付箋を削除</button>
        <button class="cancel" id="noteCancel">閉じる</button>
      </div>
    </div>
  </div>
  <div class="legend">
    <div class="item"><span class="sw" style="background:var(--problem)"></span>問題・悩み</div>
    <div class="item"><span class="sw" style="background:var(--pain)"></span>しんどい気持ち</div>
    <div class="item"><span class="sw" style="background:var(--fact)"></span>状況・事実</div>
    <div class="item"><span class="sw" style="background:var(--hope)"></span>どうなりたい</div>
  </div>
  <p class="footer-note">
    このアプリは Claude API を使用しており、テキスト解析はサーバー上で安全に処理されます。入力内容は処理後に削除されます。
  </p>
</div>

<script>
const SVGNS='http://www.w3.org/2000/svg';const $=s=>document.querySelector(s);const stage=$('#stage'),svg=$('#edges'),placeholder=$('#placeholder');const inputEl=$('#input'),goBtn=$('#go'),initNote=$('#initNote');let notes=[],edges=[],frames=[];let nid=1,eid=1,fid=1;let linkMode=false,pickFrom=null,editingEdge=null,editingNote=null;let frameSelect=false,frameSel=new Set();const frameLabelByType={problem:'つらい原因',pain:'気持ち',fact:'状況',hope:'どうしたい'};let history=[];const undoBtn=$('#undoBtn');function snapshot(){return {notes:notes.map(n=>({id:n.id,label:n.label,type:n.type,x:n.x,y:n.y})),edges:edges.map(e=>({id:e.id,from:e.from,to:e.to,label:e.label})),frames:frames.map(f=>({id:f.id,label:f.label,type:f.type,x:f.x,y:f.y,w:f.w,h:f.h})),nid,eid,fid};}function pushHistory(){history.push(snapshot());if(history.length>80)history.shift();updateUndo();}function updateUndo(){undoBtn.disabled=history.length===0;}function undo(){if(!history.length)return;if(frameSelect)exitFrameSelect();const snap=history.pop();closePops();restoreState(snap);updateUndo();}function restoreState(snap){notes.forEach(n=>n.el.remove());frames.forEach(f=>f.el.remove());edges.forEach(e=>{e.path.remove();e.hit.remove();e.text.remove();});notes=[];edges=[];frames=[];pickFrom=null;snap.frames.forEach(f=>buildFrame(Object.assign({},f)));snap.notes.forEach(n=>buildNote(Object.assign({},n),0,true));snap.edges.forEach(e=>buildEdge(Object.assign({},e)));nid=snap.nid;eid=snap.eid;fid=snap.fid;drawEdges();placeholder.style.display=(notes.length||frames.length)?'none':'';}undoBtn.addEventListener('click',undo);document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(frameSelect){exitFrameSelect();return;}if(linkMode){linkMode=false;linkBtn.classList.remove('on');stage.classList.remove('linkmode');if(pickFrom){pickFrom.el.classList.remove('pick');pickFrom=null;}hint.textContent='付箋はドラッグで移動／ダブルタップで編集・色変え';return;}closePops();return;}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){const t=document.activeElement;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable))return;ev.preventDefault();undo();}});$('#clearInput').addEventListener('click',()=>{inputEl.value='';inputEl.focus();});goBtn.addEventListener('click',async()=>{const text=inputEl.value.trim();if(!text){inputEl.focus();return;}showLoading(true);try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!response.ok)throw new Error('API error');const data=await response.json();const list=(data.words||[]).map(w=>({label:w,type:'problem'}));pushHistory();spawnNotes(list);showLoading(false);}catch(err){console.error(err);initNote.textContent='エラーが発生しました: '+err.message;showLoading(false);}});function showLoading(on){goBtn.disabled=on;let l=stage.querySelector('.loading');if(on){if(!l){l=document.createElement('div');l.className='loading';l.innerHTML='<div class="spin"></div><div>言葉を付箋にほどいています…</div>';stage.appendChild(l);}}else if(l)l.remove();}const typeOrder=['problem','pain','fact','hope'];const typeColor={problem:'var(--problem)',pain:'var(--pain)',fact:'var(--fact)',hope:'var(--hope)'};function spawnNotes(list){placeholder.style.display='none';const W=stage.clientWidth,H=stage.clientHeight;const groups={};typeOrder.forEach(t=>groups[t]=[]);list.forEach(n=>{(groups[n.type]||groups.problem).push(n);});const active=typeOrder.filter(t=>groups[t].length);const colW=W/(active.length||1);active.forEach((t,ci)=>groups[t].forEach((n,ri)=>{const x=colW*ci+colW/2+(Math.random()*26-13);const y=70+ri*84+(Math.random()*16-8);addNote(n.label,t,Math.max(70,Math.min(W-70,x)),Math.max(50,Math.min(H-50,y)),ri*55);}));}function buildNote(data,delay=0,instant=false){const n={id:data.id,label:data.label,type:data.type,x:data.x,y:data.y};const el=document.createElement('div');el.className='snote '+n.type;el.textContent=n.label;el.style.left=n.x+'px';el.style.top=n.y+'px';if(!instant){el.style.opacity='0';el.style.transition='opacity .4s ease '+delay+'ms';}stage.appendChild(el);if(!instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.opacity='1';}));n.el=el;notes.push(n);attachNoteEvents(n);return n;}function addNote(label,type,x,y,delay=0){return buildNote({id:'n'+(nid++),label,type,x,y},delay);}const addFrameBtn=$('#addFrame'),linkBtn=$('#linkMode'),hint=$('#hint');addFrameBtn.addEventListener('click',()=>{if(!frameSelect)enterFrameSelect();else confirmFrameSelect();});function enterFrameSelect(){if(linkMode){linkMode=false;linkBtn.classList.remove('on');stage.classList.remove('linkmode');if(pickFrom){pickFrom.el.classList.remove('pick');pickFrom=null;}}frameSelect=true;frameSel.clear();addFrameBtn.classList.add('on');stage.classList.add('framesel');updateFrameBtn();hint.textContent='囲みたい付箋をタップで選択 →「囲む」で枠を作成（Escで中止）';}function exitFrameSelect(){frameSelect=false;addFrameBtn.classList.remove('on');stage.classList.remove('framesel');addFrameBtn.textContent='▢ 枠で囲む';notes.forEach(n=>n.el.classList.remove('fsel'));frameSel.clear();if(hint)hint.textContent='付箋はドラッグで移動／ダブルタップで編集・色変え';}function updateFrameBtn(){addFrameBtn.textContent=frameSel.size?('囲む（'+frameSel.size+'枚）'):'囲む（付箋を選択）';}function confirmFrameSelect(){const sel=notes.filter(n=>frameSel.has(n.id));if(!sel.length){exitFrameSelect();return;}placeholder.style.display='none';let counts={},domType=$('#addType').value,best=-1,cx=0,cy=0;sel.forEach(n=>{counts[n.type]=(counts[n.type]||0)+1;cx+=n.x;cy+=n.y;});Object.keys(counts).forEach(t=>{if(counts[t]>best){best=counts[t];domType=t;}});cx/=sel.length;cy/=sel.length;let maxW=0,maxH=0;sel.forEach(n=>{maxW=Math.max(maxW,n.el.offsetWidth);maxH=Math.max(maxH,n.el.offsetHeight);});const count=sel.length,gapX=22,gapY=16,padX=20,padTop=30,padBottom=18;const cellW=maxW+gapX,cellH=maxH+gapY;const W=stage.clientWidth,H=stage.clientHeight;let cols=count<=6?1:Math.min(3,Math.ceil(count/6));let rows,gridW,gridH,frameW,frameH;function recompute(){rows=Math.ceil(count/cols);gridW=cols*cellW-gapX;gridH=rows*cellH-gapY;frameW=gridW+padX*2;frameH=gridH+padTop+padBottom;}recompute();while(frameH>H-20&&cols<4){cols++;recompute();}let fx=Math.round(cx-frameW/2),fy=Math.round(cy-frameH/2);fx=Math.max(2,Math.min(Math.max(2,W-frameW-2),fx));fy=Math.max(2,Math.min(Math.max(2,H-frameH-2),fy));pushHistory();sel.forEach((n,i)=>{const r=Math.floor(i/cols),c=i%cols;n.x=fx+padX+c*cellW+maxW/2;n.y=fy+padTop+r*cellH+maxH/2;n.el.style.transition='left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1)';n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';});addFrame(frameLabelByType[domType]||'グループ',domType,fx,fy,frameW,frameH);const t0=performance.now();(function follow(){drawEdges();if(performance.now()-t0<430)requestAnimationFrame(follow);else sel.forEach(n=>{n.el.style.transition='';});})();exitFrameSelect();}function buildFrame(data){const f={id:data.id,label:data.label,type:data.type,x:data.x,y:data.y,w:data.w,h:data.h,_editing:false};const el=document.createElement('div');el.className='frame '+f.type;el.style.left=f.x+'px';el.style.top=f.y+'px';el.style.width=f.w+'px';el.style.height=f.h+'px';el.innerHTML='<div class="frame-label" spellcheck="false">'+escapeHtml(f.label)+'</div><div class="frame-del">×</div><div class="frame-handle"></div>';stage.appendChild(el);f.el=el;frames.push(f);attachFrameEvents(f);return f;}function addFrame(label,type,x,y,w,h){return buildFrame({id:'f'+(fid++),label,type,x,y,w,h});}function attachFrameEvents(f){const el=f.el,handle=el.querySelector('.frame-handle'),lab=el.querySelector('.frame-label'),del=el.querySelector('.frame-del');let act=false,sx=0,sy=0,startX=0,startY=0,group=[],snapDown=null,moved=false;el.addEventListener('pointerdown',ev=>{if(ev.target===handle||ev.target===lab||ev.target===del)return;act=true;moved=false;snapDown=snapshot();el.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;startX=f.x;startY=f.y;group=notes.filter(n=>n.x>=f.x&&n.x<=f.x+f.w&&n.y>=f.y&&n.y<=f.y+f.h).map(n=>({n,dx:n.x-
